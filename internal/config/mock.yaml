# Mock development configuration, used by `goblins serve --mock`.
# It needs no tracker credentials and no agent subscription login.
version: 1
installation:
  name: mock
  data_dir: ./data/mock
trackers:
  mock: {type: fake}
scms:
  mock: {type: fake}
event_sources:
  mock: {type: fake}
agents:
  mock: {type: fake}
runtimes:
  mock: {type: fake}
projects:
  - id: demo
    tracker: mock
    scm: mock
    event_sources: [mock]
    repository: example/demo
    base_branch: main
    # Mock mode tries out the workflow, with nothing real to test or review.
    policy: {allow_unvalidated_draft_pr: true, allow_skipped_review: true, stop_at_report: true}
    stages:
      planner: {agent: mock, runtime: mock}
      implementer: {agent: mock, runtime: mock}
# The operator console is off unless GOBLINS_CONSOLE_LISTEN is set. Its one operator logs in
# with the token in GOBLINS_CONSOLE_TOKEN, at least 32 characters.
console:
  operators:
    - {name: operator, role: operator, token_env: GOBLINS_CONSOLE_TOKEN}
