apiVersion: v1
kind: Service
metadata:
  name: {{ include "goblins.name" . }}
  labels: {{- include "goblins.labels" . | nindent 4 }}
spec:
  selector: {{- include "goblins.selector" . | nindent 4 }}
  ports:
    - {name: http, port: {{ .Values.service.port }}, targetPort: http}
---
{{- if .Values.metrics.enabled }}
# Metrics have no login: this Service is for a scraper inside the cluster only.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "goblins.name" . }}-metrics
  labels: {{- include "goblins.labels" . | nindent 4 }}
spec:
  selector: {{- include "goblins.selector" . | nindent 4 }}
  ports:
    - {name: metrics, port: {{ .Values.metrics.port }}, targetPort: metrics}
---
{{- end }}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "goblins.name" . }}
  labels: {{- include "goblins.labels" . | nindent 4 }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ required "ingress.host is required" .Values.ingress.host | quote }}
      http:
        paths:
          - path: /webhooks/
            pathType: Prefix
            backend:
              service:
                name: {{ include "goblins.name" . }}
                port: {name: http}
{{- end }}
