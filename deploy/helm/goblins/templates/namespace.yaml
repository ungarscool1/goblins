{{- if .Values.workloads.createNamespace }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "goblins.workloadNamespace" . }}
  labels:
    {{- include "goblins.labels" . | nindent 4 }}
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
{{- end }}
